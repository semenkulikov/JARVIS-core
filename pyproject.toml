[project]
name = "jarvis-voice-assistant"
version = "3.16.0"
description = "Офлайн-голосовой помощник для Windows на русском языке"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Semyon Saifutdinov", email = "saifutdinov2006@mail.ru" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
