[project]
name = "jarvis-voice-assistant"
version = "3.18.0"
description = "Офлайн-голосовой помощник для Windows на русском языке"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Semyon Saifutdinov", email = "saifutdinov2006@mail.ru" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Correctness only (pyflakes + bugbear); the compact one-line style is intentional and not linted.
select = ["F", "B"]

[tool.mypy]
# Typed from the start: the layered package. The flat legacy modules are followed silently.
python_version = "3.12"
mypy_path = "src"
files = ["src/jarvis"]
explicit_package_bases = true
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
