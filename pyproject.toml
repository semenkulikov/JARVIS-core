[project]
name = "jarvis-voice-assistant"
version = "3.19.0"
description = "Офлайн-голосовой помощник для Windows на русском языке"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Semyon Saifutdinov", email = "saifutdinov2006@mail.ru" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Correctness only (pyflakes + bugbear); the compact one-line style is intentional and not linted.
select = ["F", "B"]

[tool.mypy]
# The layered package is checked strictly. The flat modules still outside it are followed
# silently; calls into them and Any leaking out of them are allowed until they move in.
python_version = "3.12"
mypy_path = "src"
files = ["src/jarvis"]
explicit_package_bases = true
follow_imports = "silent"
ignore_missing_imports = true
strict = true
disallow_untyped_calls = false
warn_return_any = false
