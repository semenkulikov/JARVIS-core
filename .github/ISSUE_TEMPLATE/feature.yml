name: Предложение
description: Команда, голос или поведение, которого не хватает
title: "Предложение: "
body:
  - type: textarea
    id: what
    attributes:
      label: Что нужно
      description: Какую фразу вы хотите сказать и что помощник должен сделать.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка
      options:
        - label: Я не приложил настройки, секреты и личные журналы
          required: true
